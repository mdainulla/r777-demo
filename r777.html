<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R777 Pro Demo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Arial';}
  body{background:#0d0d0d;color:#fff;}
  .header{background:#111;padding:10px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ffaa00;}
  .logo{color:#ffaa00;font-size:22px;font-weight:bold;}
  .balance{color:#00ff00;font-weight:bold;}
  .banner{background:linear-gradient(90deg,#ffaa00,#ff5500);padding:15px;text-align:center;margin:10px;border-radius:10px;}
  .game-box{background:#1a1a1a;margin:10px;padding:15px;border-radius:12px;border:1px solid #333;}
  .plane-area{background:#000;height:200px;border-radius:10px;position:relative;overflow:hidden;text-align:center;padding-top:70px;}
  .plane{font-size:50px;position:absolute;left:10%;top:50%;}
  .multi{font-size:40px;color:#ffaa00;font-weight:bold;}
  .bet-area{display:flex;gap:10px;margin-top:15px;}
  .bet-btn{flex:1;background:#ffaa00;color:#000;border:none;padding:15px;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;}
  .cashout{background:#00c853;}
  .btn-wa{background:#25D366;color:#fff;padding:12px;width:100%;border-radius:8px;text-align:center;text-decoration:none;display:block;margin:10px 0;font-weight:bold;}
  .admin{background:#222;padding:10px;border-radius:8px;margin-top:10px;}
  input{width:100%;padding:10px;margin:5px 0;border-radius:5px;border:none;background:#333;color:#fff;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">R777 DEMO</div>
  <div class="balance"><span id="balance">0</span> KB</div>
</div>

<div class="banner">
  🎁 প্রথম Login এ 100 KB ফ্রি!
</div>

<a href="https://wa.me/8801945952533?text=ভাই%20আমার%20কয়েন%20লাগবে" target="_blank" class="btn-wa">
  💰 কয়েন লাগলে WhatsApp করুন
</a>

<div class="game-box">
  <h3>✈️ AVIATOR DEMO</h3>
  <div class="plane-area">
    <div class="plane" id="plane">✈️</div>
    <div class="multi"><span id="multi">1.00</span>x</div>
    <p id="status">Bet করার জন্য অপেক্ষা করছে...</p>
  </div>
  
  <div class="bet-area">
    <button class="bet-btn" onclick="bet(10)">Bet 10 KB</button>
    <button class="bet-btn cashout" onclick="cashout()">Cashout</button>
  </div>
</div>

<div class="game-box admin">
  <h4>🔑 Admin Panel</h4>
  <input id="addUser" placeholder="ইউজারের নাম">
  <button class="bet-btn" onclick="addCoin(100)">+ 100 KB দিন</button>
  <button class="bet-btn" onclick="addCoin(500)">+ 500 KB দিন</button>
</div>

<script>
let balance=0,playing=false,currentMulti=1.00,betAmount=0,currentUser="Guest";

// প্রথমে 100 ফ্রি
window.onload=function(){
  let saved=localStorage.getItem('demo_balance');
  let free=localStorage.getItem('demo_free');
  if(!free){balance=100;localStorage.setItem('demo_free','yes');alert("100 KB ফ্রি পেয়েছেন!")}
  else{balance=parseInt(saved)||0}
  updateBalance();
}

function updateBalance(){
  document.getElementById('balance').innerText=balance;
  localStorage.setItem('demo_balance',balance);
}

function bet(amount){
  if(balance<amount){alert("কয়েন নাই! WhatsApp করুন");return;}
  betAmount=amount;balance-=amount;playing=true;currentMulti=1.00;
  document.getElementById('status').innerText="উড়ছে...";
  let pos=10;
  let fly=setInterval(()=>{
    if(!playing){clearInterval(fly);return;}
    currentMulti+=0.04;pos+=2;
    document.getElementById('multi').innerText=currentMulti.toFixed(2);
    document.getElementById('plane').style.left=pos+'%';
    if(Math.random()>0.97){playing=false;betAmount=0;document.getElementById('status').innerText="💥 ক্র্যাশ!";clearInterval(fly);updateBalance();}
  },150);
}

function cashout(){
  if(!playing)return;
  playing=false;
  let win=betAmount*currentMulti;
  balance+=win;
  document.getElementById('status').innerText=`🎉 জিতলেন ${win.toFixed(2)} KB`;
  updateBalance();
}

function addCoin(amount){
  balance+=amount;updateBalance();alert(amount+" KB যোগ হলো");
}
</script>

</body>
</html>
