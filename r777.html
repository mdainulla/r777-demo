<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R777 ডেমো</title>
<style>
body { background: #0a0e1a; color: white; font-family: Arial; text-align: center; padding: 10px; }
h1 { color: #00ff88; }
.btn { background: #1f2937; color: white; border: none; padding: 10px 15px; margin: 5px; border-radius: 8px; cursor: pointer; }
.btn.active { background: #00ff88; color: black; }
.game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
.game-card { background: #111827; padding: 15px; border-radius: 12px; cursor: pointer; }
.game-card.locked { opacity: 0.4; }
.game-box { background: #111827; padding: 20px; border-radius: 15px; margin-top: 20px; display: none; }
#plane { font-size: 50px; transition: all 0.1s linear; }
#multiplier { font-size: 40px; color: #ffcc00; font-weight: bold; margin: 10px 0; }
#startBtn { background: #00ff88; color: black; padding: 15px 30px; font-size: 18px; border: none; border-radius: 10px; }
.balance { color: #ffcc00; font-size: 18px; }
</style>
</head>
<body>

<h1>R777 ডেমো</h1>
<p class="balance">ব্যালেন্স: <span id="balance">100.00</span> কয়েন</p>

<button class="btn active" onclick="showTab('games')">সব গেম</button>
<button class="btn" onclick="showTab('plane')">বিমান গেম</button>

<div id="games" class="game-grid">
  <div class="game-card" onclick="openGame('plane')">
    <h3>✈️ বিমান গেম</h3>
    <p>10x পর্যন্ত</p>
  </div>
  <div class="game-card" onclick="openGame('coin')">
    <h3>🪙 কয়েন গেম</h3>
    <p>1 পয়সা 2 পয়সা</p>
  </div>
  <div class="game-card locked">
    <h3>🎰 স্লট</h3>
    <p>শীঘ্রই আসছে</p>
  </div>
  <div class="game-card locked">
    <h3>🎲 ডাইস</h3>
    <p>শীঘ্রই আসছে</p>
  </div>
  <div class="game-card locked">
    <h3>♠️ কার্ড</h3>
    <p>শীঘ্রই আসছে</p>
  </div>
  <div class="game-card locked">
    <h3>🔥 রুলেট</h3>
    <p>শীঘ্রই আসছে</p>
  </div>
</div>

<div id="plane" class="game-box">
  <h2>বিমান গেম</h2>
  <div id="planeIcon">✈️</div>
  <div id="multiplier">1.00x</div>
  <button id="startBtn" onclick="startPlane()">উড়ান শুরু</button>
  <p>নিয়ম: 10 বারের মধ্যে 1 বার 5x+ যাবে</p>
  <button class="btn" onclick="showTab('games')">পিছনে</button>
</div>

<div id="coin" class="game-box">
  <h2>কয়েন গেম</h2>
  <p>1 পয়সা = 1 কয়েন, 2 পয়সা = 2 কয়েন</p>
  <button class="btn" onclick="addCoin(1)">+1 পয়সা</button>
  <button class="btn" onclick="addCoin(2)">+2 পয়সা</button>
  <button class="btn" onclick="showTab('games')">পিছনে</button>
</div>

<script>
let balance = 100;
let gameRunning = false;
let multiplier = 1.00;
let crashPoint = 1.50;
let roundCount = 0;
let interval;

function showTab(tab){
  document.getElementById('games').style.display = tab==='games' ? 'grid' : 'none';
  document.getElementById('plane').style.display = tab==='plane' ? 'block' : 'none';
  document.getElementById('coin').style.display = tab==='coin' ? 'block' : 'none';
}

function openGame(game){
  if(game==='plane') showTab('plane');
  if(game==='coin') showTab('coin');
}

function addCoin(val){
  balance += val;
  document.getElementById('balance').innerText = balance.toFixed(2);
}

function startPlane() {
  if(gameRunning) return;
  gameRunning = true;
  roundCount++;
  multiplier = 1.00;
  document.getElementById('planeIcon').style.marginTop = '0px';
  
  if(roundCount % 10 === 0){
    crashPoint = (Math.random() * 5 + 5).toFixed(2); // 5x to 10x
  } else {
    crashPoint = (Math.random() * 3 + 1).toFixed(2); // 1x to 4x
  }

  document.getElementById('startBtn').innerText = "চলছে...";
  document.getElementById('startBtn').disabled = true;

  interval = setInterval(() => {
    multiplier += 0.05;
    document.getElementById('multiplier').innerText = multiplier.toFixed(2) + 'x';
    document.getElementById('planeIcon').style.marginTop = -(multiplier * 8) + 'px';

    if(multiplier >= crashPoint){
      clearInterval(interval);
      document.getElementById('multiplier').innerText = multiplier.toFixed(2) + 'x CRASH!';
      document.getElementById('multiplier').style.color = 'red';
      gameRunning = false;
      document.getElementById('startBtn').innerText = "উড়ান শুরু";
      document.getElementById('startBtn').disabled = false;
      setTimeout(() => { document.getElementById('multiplier').style.color = '#ffcc00'; }, 2000);
    }
  }, 100);
}
</script>

</body>
  </html>
