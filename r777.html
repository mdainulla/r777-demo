<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyPlay Pro Demo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Arial';}
  body{background:#070707;color:#fff;}
  .header{background:#111;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #00d4ff;position:sticky;top:0;}
  .logo{color:#00d4ff;font-size:20px;font-weight:bold;}
  .balance{color:#00ff88;font-weight:bold;}
  .top-btns{display:flex;gap:8px;}
  .top-btn{background:#00d4ff;color:#000;padding:8px 12px;border-radius:6px;text-decoration:none;font-weight:bold;font-size:12px;}
  .banner{background:linear-gradient(90deg,#00d4ff,#0088ff);padding:15px;text-align:center;margin:10px;border-radius:10px;font-weight:bold;}
  .games-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px;}
  .game-card{background:#151515;padding:15px;border-radius:10px;text-align:center;cursor:pointer;border:1px solid #222;}
  .game-card:hover{background:#222;}
  .game-icon{font-size:30px;margin-bottom:5px;}
  .box{background:#151515;margin:10px;padding:15px;border-radius:12px;border:1px solid #222;}
  .btn{width:100%;padding:14px;border:none;border-radius:8px;font-weight:bold;margin:6px 0;cursor:pointer;font-size:15px;}
  .btn-wa{background:#25D366;color:#fff;text-decoration:none;display:block;text-align:center;}
  .btn-admin{background:#ffaa00;color:#000;}
  input{width:100%;padding:10px;margin:5px 0;border-radius:5px;border:none;background:#333;color:#fff;}
  .fly-zone{background:#000;height:200px;border-radius:10px;text-align:center;padding-top:70px;position:relative;}
  .rocket{font-size:50px;position:absolute;left:10%;top:50%;}
  .multi{font-size:35px;color:#00d4ff;font-weight:bold;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">🚀 SkyPlay DEMO</div>
  <div>
    <span class="balance"><span id="bal">100</span> COIN</span>
  </div>
</div>

<div class="top-btns" style="padding:10px;">
  <a href="https://wa.me/8801945952533" target="_blank" class="top-btn">💰 জমা</a>
  <a href="https://wa.me/8801945952533" target="_blank" class="top-btn">💸 উত্তোলন</a>
  <a href="#admin" class="top-btn">🔑 Admin</a>
</div>

<div class="banner">
  🎁 প্রথম Login এ 100 COIN ফ্রি! | COIN লাগলে জমা বাটনে চাপ দিন
</div>

<h3 style="padding:0 10px;">🔥 জনপ্রিয় গেমস</h3>
<div class="games-grid">
  <div class="game-card" onclick="openGame('rocket')">
    <div class="game-icon">🚀</div>
    <div>Rocket</div>
  </div>
  <div class="game-card" onclick="alert('শীঘ্রই আসছে')">
    <div class="game-icon">🎰</div>
    <div>SuperAce</div>
  </div>
  <div class="game-card" onclick="alert('শীঘ্রই আসছে')">
    <div class="game-icon">🐯</div>
    <div>Tiger</div>
  </div>
  <div class="game-card" onclick="alert('শীঘ্রই আসছে')">
    <div class="game-icon">🎲</div>
    <div>Dragon</div>
  </div>
  <div class="game-card" onclick="alert('শীঘ্রই আসছে')">
    <div class="game-icon">💎</div>
    <div>Diamond</div>
  </div>
  <div class="game-card" onclick="alert('শীঘ্রই আসছে')">
    <div class="game-icon">🃏</div>
    <div>Card</div>
  </div>
  <div class="game-card" onclick="alert('শীঘ্রই আসছে')">
    <div class="game-icon">⚽</div>
    <div>Sports</div>
  </div>
  <div class="game-card" onclick="alert('শীঘ্রই আসছে')">
    <div class="game-icon">🎯</div>
    <div>Lottery</div>
  </div>
  <div class="game-card" onclick="alert('শীঘ্রই আসছে')">
    <div class="game-icon">👑</div>
    <div>King</div>
  </div>
</div>

<div id="game-area" class="box" style="display:none;">
  <h3>🚀 Rocket Game</h3>
  <div class="fly-zone">
    <div class="rocket" id="rocket">🚀</div>
    <div class="multi"><span id="x">1.00</span>x</div>
    <p id="msg">Bet করুন</p>
  </div>
  <button class="btn" style="background:#00d4ff;color:#000" onclick="start(10)">Bet 10 COIN</button>
  <button class="btn" style="background:#00d4ff;color:#000" onclick="start(50)">Bet 50 COIN</button>
  <button class="btn" style="background:#00ff88;color:#000" onclick="stop()">Cashout</button>
</div>

<div id="admin" class="box">
  <h4>🔑 Admin Panel</h4>
  <input id="u" placeholder="ইউজার নাম লিখুন">
  <button class="btn btn-admin" onclick="give(100)">+100 COIN দিন</button>
  <button class="btn btn-admin" onclick="give(500)">+500 COIN দিন</button>
  <button class="btn" style="background:#ff4444;color:#fff" onclick="reset()">Reset Balance</button>
</div>

<script>
let bal=100,play=false,x=1,b=0,pos=10;
function upd(){document.getElementById('bal').innerText=bal.toFixed(2)}
function openGame(g){document.getElementById('game-area').style.display='block';window.scrollTo(0,document.getElementById('game-area').offsetTop)}

function start(a){
  if(play)return alert("আগের রাউন্ড শেষ করুন");
  if(bal<a)return alert("COIN নাই! জমা বাটনে চাপ দিন");
  bal-=a;b=a;play=true;x=1.00;pos=10;
  document.getElementById('msg').innerText="Flying...";
  let i=setInterval(()=>{
    if(!play){clearInterval(i);return;}
    x+=0.04;pos+=2;
    document.getElementById('x').innerText=x.toFixed(2);
    document.getElementById('rocket').style.left=pos+'%';
    if(Math.random()>0.96 || pos>90){
      play=false;b=0;
      document.getElementById('msg').innerText="💥 Crashed!";
      upd();clearInterval(i);
    }
  },120)
}

function stop(){
  if(!play)return;
  play=false;
  let win=b*x;
  bal+=win;
  document.getElementById('msg').innerText=`🎉 Won ${win.toFixed(2)} COIN`;
  upd();
}

function give(n){bal+=n;upd();alert(n+" COIN যোগ হলো")}
function reset(){bal=100;upd();alert("Balance Reset")}
upd();
</script>
</body>
 </html>
